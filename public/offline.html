<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Offline | Penthouse Drift</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; background: #09090b; color: #f4f4f5; text-align: center; }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #a1a1aa; line-height: 1.5; }
    button { border: 0; border-radius: 12px; padding: 12px 20px; background: #f59e0b; color: #09090b; font-weight: 800; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Penthouse Drift">
    <h1>You’re offline</h1>
    <p>Reconnect to use memberships, check-ins, the store, and your latest account data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
